<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>办公室美术对照 · 三套语言</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   方案 B —— 纵向走廊
   一条走廊从楼上通到楼下，工位左右交替挂在走廊两边，人都背对镜头坐着。
   交接 = 起身、沿走廊纵向走到对方工位、递文件、走回（1600ms 分段）。

   口径：
   · 颜色全部走 DSH alias token；本文件的 :root 只是把 light/dark 的真实
     解析值就地模拟一份（值取自 dsh-client-ui-theme）。唯一硬编码的墨色
     是剪影的明暗两笔。
   · 窄栏退化用 @container；全文件只有一条 @media，就是 reduced-motion。
   · 动效全部是「事件驱动 + 有限时长」，状态本身是静态的：办公室会安静下来，
     只有发生事情的时候才动。
   ══════════════════════════════════════════════════════════════════════ */

:root{
  color-scheme: light;
  --dsw-alias-bg-base:#ffffff;
  --dsw-alias-bg-layer-1:#ffffff;
  --dsw-alias-bg-layer-2:#ffffff;
  --dsw-alias-bg-layer-3:#ffffff;
  --dsw-alias-bg-overlay:#e9ecf2;
  --dsw-alias-border-l1:#0000000a;
  --dsw-alias-border-l2:#0000001a;
  --dsw-alias-label-primary:#0f1115;
  --dsw-alias-label-secondary:#61666b;
  --dsw-alias-label-tertiary:#81858c;
  --dsw-alias-label-caption:#adb2b8;
  --dsw-alias-label-primary-inverted:#ffffff;
  --dsw-alias-brand-primary:#0f1115;
  --dsw-alias-interactive-bg-hover:#2631480f;
  --dsw-alias-interactive-bg-active:#2631481a;
  --dsw-alias-state-idle-primary:#d4d4d4;
  --dsw-alias-state-business-primary:#4176e6;
  --dsw-alias-state-warn-primary:#f59e0b;
  --dsw-alias-state-success-primary:#22c55e;
  --dsw-alias-state-error-primary:#ec1313;
  --dsw-specific-sidebar-fill:#f9fafb;
  /* 吉祥物墨色族：spec 规定明暗两主题必须一致，所以不能是主题别名 */
  --wt-ink:#171b22;
  --wt-ink-2:#333d4b;
  --wt-paper:#f2f4f7;
  --wt-ink-panel:#23262c;
  --wt-ink-screen:#0d1015;
  /* 场景墨色：显示器面板 / 接触阴影。全文件仅有的几处硬编码。 */
  --office-ink-panel:#0b0d10e6;
  --office-ink-shade:#0000002e;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --dsw-alias-bg-base:#151517;
  --dsw-alias-bg-layer-1:#232324;
  --dsw-alias-bg-layer-2:#2c2c2e;
  --dsw-alias-bg-layer-3:#353638;
  --dsw-alias-bg-overlay:#61666b;
  --dsw-alias-border-l1:#ffffff0f;
  --dsw-alias-border-l2:#ffffff1f;
  --dsw-alias-label-primary:#f9fafb;
  --dsw-alias-label-secondary:#cfd3d6;
  --dsw-alias-label-tertiary:#adb2b8;
  --dsw-alias-label-caption:#81858c;
  --dsw-alias-label-primary-inverted:#353638;
  --dsw-alias-brand-primary:#f9fafb;
  --dsw-alias-interactive-bg-hover:#ffffff14;
  --dsw-alias-interactive-bg-active:#ffffff24;
  --dsw-alias-state-idle-primary:#545557;
  --dsw-alias-state-business-primary:#7aaaff;
  --dsw-alias-state-warn-primary:#f59e0b;
  --dsw-alias-state-success-primary:#22c55e;
  --dsw-alias-state-error-primary:#f25a5a;
  --dsw-specific-sidebar-fill:#1b1b1c;
  --office-ink-panel:#07080ae6;
  --office-ink-shade:#0000005c;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  background:var(--dsw-alias-bg-base);
  color:var(--dsw-alias-label-primary);
  font:400 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--dsw-alias-brand-primary); outline-offset:2px; }

/* ── 页面：故意不留左右内距，300px 视口下 300px 侧栏正好贴满 ────────── */
.page{
  display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center;
  gap:20px; padding:20px 0 40px;
}
.stage{ --w:300px; flex:0 0 auto; width:var(--w); display:flex; flex-direction:column; gap:10px; }

/* ── 演示工具条（在假侧栏之外，属于 demo 不属于产品） ───────────────── */
.bar{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-width:0; }
.bar-tag{
  flex:1 1 auto; min-width:0; font-size:11px; line-height:16px; color:var(--dsw-alias-label-secondary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.bar-btn{
  flex:none; height:26px; padding:0 9px; border-radius:7px; cursor:pointer;
  border:1px solid var(--dsw-alias-border-l2);
  background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-secondary);
  font-size:11px; line-height:1;
}
.bar-btn:hover{ color:var(--dsw-alias-label-primary); border-color:var(--dsw-alias-brand-primary); }
.bar-btn[aria-pressed="true"]{
  color:var(--dsw-alias-label-primary); font-weight:600;
  border-color:var(--dsw-alias-brand-primary);
  background:var(--dsw-alias-interactive-bg-hover);
}
.bar-seg{ flex:none; display:flex; gap:2px; padding:2px; border-radius:8px; background:var(--dsw-alias-interactive-bg-hover); }
.bar-seg .bar-btn{ border-color:transparent; background:transparent; height:22px; padding:0 8px; }
.bar-seg .bar-btn[aria-pressed="true"]{ background:var(--dsw-alias-bg-layer-1); border-color:var(--dsw-alias-border-l2); }

/* ── 假侧边栏框 ─────────────────────────────────────────────────── */
.frame{
  width:var(--w); height:756px; display:flex; flex-direction:column; min-height:0;
  background:var(--dsw-specific-sidebar-fill);
  border:1px solid var(--dsw-alias-border-l2); border-radius:12px; overflow:hidden;
  box-shadow:0 10px 28px var(--office-ink-shade);
}
.frame-tabs{
  flex:none; display:flex; align-items:stretch; gap:2px; height:34px; padding:0 8px;
  border-bottom:1px solid var(--dsw-alias-border-l1);
}
.frame-tab{
  border:0; background:transparent; cursor:pointer; padding:0 8px;
  font-size:12px; color:var(--dsw-alias-label-secondary);
  border-bottom:2px solid transparent;
}
.frame-tab:hover{ color:var(--dsw-alias-label-primary); }
.frame-tab[aria-selected="true"]{ color:var(--dsw-alias-label-primary); font-weight:600; border-bottom-color:var(--dsw-alias-brand-primary); }
.frame-spacer{ flex:1; }

/* ── 办公室：容器查询的宿主 ───────────────────────────────────────── */
.office{
  flex:1; min-height:0; display:flex; flex-direction:column;
  padding:0 10px 10px; container-type:inline-size;
}

.stats{
  flex:none; height:26px; display:flex; align-items:center; gap:8px; margin:0;
  font-size:10.5px; color:var(--dsw-alias-label-secondary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.stat{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
.stat + .stat::before{ content:'·'; margin-right:8px; opacity:.5; }

/* ── 楼层：一条纵向走廊，七个工位左右交替挂着 ─────────────────────── */
.floor{
  position:relative; flex:none; margin-block:auto;
  display:grid; grid-template-columns:1fr 46px 1fr; grid-auto-rows:70px; row-gap:0;
}
.floor::before{ /* 走廊：比地面略亮的一条地毯 */
  content:''; position:absolute; z-index:0; top:-4px; bottom:-4px; left:50%; width:46px;
  transform:translateX(-50%); pointer-events:none; border-radius:5px;
  background:color-mix(in srgb,var(--dsw-alias-label-primary) 4%,transparent);
  border-left:1px solid var(--dsw-alias-border-l1);
  border-right:1px solid var(--dsw-alias-border-l1);
}
.floor::after{ /* 走廊中线 */
  content:''; position:absolute; z-index:0; top:0; bottom:0; left:50%; width:1px;
  transform:translateX(-50%); pointer-events:none;
  background-image:repeating-linear-gradient(180deg,var(--dsw-alias-border-l2) 0 4px,transparent 4px 10px);
}

/* ── 工位：靠走廊那一侧坐人，显示器在靠墙那一侧 ───────────────────── */
.seat{
  position:relative; z-index:1; min-width:0; display:flex; grid-row:var(--row);
  --wt-raw:var(--dsw-alias-state-idle-primary);
  --wt-accent:var(--role-accent); --wt-soft:var(--role-soft);
}
.seat[data-side="left"]{ grid-column:1; justify-content:flex-end; padding-right:7px; }
.seat[data-side="right"]{ grid-column:3; justify-content:flex-start; padding-left:7px; }
.seat[data-state="idle"]{ --wt-raw:var(--dsw-alias-state-idle-primary); }
.seat[data-state="working"]{ --wt-raw:var(--dsw-alias-state-business-primary); }
.seat[data-state="provisioning"]{ --wt-raw:var(--dsw-alias-state-business-primary); }
.seat[data-state="waiting"]{ --wt-raw:var(--dsw-alias-state-warn-primary); }
.seat[data-state="done"]{ --wt-raw:var(--dsw-alias-state-success-primary); }
.seat[data-state="error"]{ --wt-raw:var(--dsw-alias-state-error-primary); }
.seat[data-state="failed"]{ --wt-raw:var(--dsw-alias-state-error-primary); }

.desk{
  position:relative; height:100%; width:104px; display:flex; flex-direction:column;
  justify-content:flex-end; gap:1px; padding:0 2px 1px;
  border:0; border-radius:8px; background:transparent; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.seat[data-side="left"] .desk{ align-items:flex-end; }
.seat[data-side="right"] .desk{ align-items:flex-start; }
.desk:hover{ background:var(--dsw-alias-interactive-bg-hover); }
.desk:focus-visible{ outline:2px solid var(--dsw-alias-brand-primary); outline-offset:-2px; }
.seat[data-picked="true"] .desk{ background:color-mix(in srgb,var(--role-accent) 11%,transparent); }
.seat[data-state="failed"] .desk{ opacity:.55; }

/* 美术区是横的：显示器在靠墙侧，后脑勺在靠走廊侧（右侧工位镜像） */
.art{ position:relative; display:flex; align-items:flex-end; gap:3px; height:46px; }
/* ── 家具：这一层是这轮新加的，用来把「图标拼贴」变成「一个人坐在工位上」 ── */
.chair{ /* 椅背：从角色背后探出两侧 */
  position:absolute; z-index:0; left:50%; bottom:2px; width:34px; height:21px;
  transform:translateX(-50%); border-radius:11px 11px 4px 4px;
  background:color-mix(in srgb,var(--dsw-alias-label-primary) 7%,transparent);
  border:1px solid var(--dsw-alias-border-l2);
}
.ground{ /* 地面锚线 + 接触阴影：把工位钉在地上 */
  position:absolute; z-index:0; left:0; right:0; bottom:-2px; height:6px;
  background:radial-gradient(ellipse at 50% 0%,var(--office-ink-shade),transparent 72%);
}
.ground::after{
  content:''; position:absolute; left:4px; right:4px; top:0; height:1px;
  background:color-mix(in srgb,var(--dsw-alias-label-primary) 9%,transparent);
}
.surface{ /* 桌面：2px 前沿高光 + 投影，压在最前，人坐在桌子后面 */
  position:absolute; z-index:3; left:-3px; right:-3px; bottom:0; height:7px; border-radius:3px;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--dsw-alias-label-primary) 13%,var(--dsw-alias-bg-base)),
    color-mix(in srgb,var(--dsw-alias-label-primary) 8%,var(--dsw-alias-bg-base)));
  border-bottom:2px solid color-mix(in srgb,var(--dsw-alias-label-primary-inverted) 34%,transparent);
  box-shadow:0 4px 8px -2px var(--office-ink-shade);
}
.mshadow{ /* 显示器落在桌面上的影子 */
  position:absolute; z-index:-1; left:50%; bottom:-4px; width:40px; height:6px;
  transform:translateX(-50%); border-radius:50%;
  background:radial-gradient(closest-side,var(--office-ink-shade),transparent);
}
.seat[data-side="right"] .art{ flex-direction:row-reverse; }
.monitor{
  position:relative; flex:none; width:42px; height:17px; margin-bottom:8px; border-radius:3px;
  box-shadow:0 6px 12px var(--office-ink-shade);
}
.glow{ /* 屏幕光：贴在显示器周围 */
  position:absolute; z-index:-1; left:50%; top:50%; width:74px; height:52px;
  transform:translate(-50%,-50%); border-radius:50%; opacity:.22; filter:blur(2px);
  background:radial-gradient(closest-side,color-mix(in srgb,var(--wt-raw) 82%,transparent),transparent 72%);
}
.leak{
  position:absolute; left:50%; top:-1px; width:26px; height:2px;
  transform:translateX(-50%); border-radius:2px; opacity:0;
  background:linear-gradient(90deg,transparent,var(--wt-raw),transparent);
}
.mascot{ position:relative; z-index:1; flex:none; width:46px; height:46px; transform-origin:50% 92%; }
.seat[data-side="left"]{ --light-x:24%; }
.seat[data-side="right"]{ --light-x:76%; }
.msvg{
  display:block; width:100%; height:100%; overflow:visible;
  filter:drop-shadow(0 -1px 2px color-mix(in srgb,var(--wt-raw) 52%,transparent));
}
.mon-svg{ display:block; width:100%; height:100%; overflow:visible; }
.msprite{ position:absolute; width:0; height:0; overflow:hidden; }
.ring{
  position:absolute; z-index:-1; inset:-1px; border-radius:50%; opacity:0;
  border:1.5px dashed var(--dsw-alias-state-business-primary);
}
.bubble{
  position:absolute; z-index:6; right:-4px; top:0; width:16px; height:16px; border-radius:50%; opacity:0;
  display:grid; place-items:center; font-size:10px; font-weight:700;
  background:var(--dsw-alias-bg-layer-3); border:1px solid var(--dsw-alias-state-warn-primary);
  color:var(--dsw-alias-state-warn-primary); box-shadow:0 2px 6px var(--office-ink-shade);
}
.sparkle{
  position:absolute; z-index:6; right:-3px; top:-5px; font-size:14px; line-height:1; opacity:0;
  color:var(--dsw-alias-state-success-primary);
}
.file{
  position:absolute; z-index:2; left:50%; bottom:-2px; width:14px; height:10px;
  transform:translateX(-50%) rotate(-8deg); border-radius:2px; opacity:0;
  background:color-mix(in srgb,var(--role-soft) 78%,var(--dsw-alias-bg-layer-2));
  border:1px solid color-mix(in srgb,var(--role-accent) 60%,transparent);
}

/* ── 状态：姿态本身就是状态（spec 的四态 + 我延展的四态） ─────────────
   collar = 你是谁；monitor glow + 姿态 = 你现在怎么样。两套颜色系统不打架。 */
.seat[data-state="working"] .glow{ opacity:.95; }
.seat[data-state="working"] .leak{ opacity:.9; }
.seat[data-state="working"] .mascot{ animation:wt-bob 1.15s ease-in-out 3; }

.seat[data-state="waiting"] .glow{ opacity:.6; }
.seat[data-state="waiting"] .mascot{ animation:wt-wait 1.8s ease-in-out 2; }
.seat[data-state="waiting"] .bubble{ opacity:1; animation:wt-bubble 1.1s ease-in-out 3; }

.seat[data-state="done"] .glow{ opacity:.75; }
.seat[data-state="done"] .sparkle{ animation:wt-sparkle 1.3s ease-out 1 both; }

.seat[data-state="error"] .glow{ opacity:.5; }
.seat[data-state="error"] .mascot{ animation:wt-shake .55s ease-in-out 3; }

.seat[data-state="failed"] .glow{ opacity:0; }
.seat[data-state="failed"] .art{ filter:grayscale(.72); }
.seat[data-state="failed"] .msvg{ opacity:.42; }

.seat[data-state="provisioning"] .glow{ opacity:.15; }
.seat[data-state="provisioning"] .ring{ opacity:1; animation:wt-spin 2.4s linear 1; }
.seat[data-state="provisioning"] .msvg{ opacity:.72; }

/* ── 铭牌：一行，名字 · （380 时角色 ·）状态 ────────────────────── */
.plate{
  flex:none; display:flex; align-items:center; gap:4px; height:22px; max-width:100%;
  font-size:11px; line-height:16px; color:var(--dsw-alias-label-secondary);
}
.plate-name{
  flex:none; font-size:11.5px; font-weight:600; color:var(--dsw-alias-label-primary);
  white-space:nowrap;
}
.plate-role{ display:none; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.plate-sep{ display:none; opacity:.45; }
.plate-dot{ flex:none; width:6px; height:6px; border-radius:50%; background:var(--wt-raw); }
.plate-state{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seat[data-state="waiting"] .plate-state{ color:var(--dsw-alias-state-warn-primary); }
.seat[data-state="error"] .plate-state,
.seat[data-state="failed"] .plate-state{ color:var(--dsw-alias-state-error-primary); }

/* 暂停：只对能打断的两态出现，和真实行一致 */
.stop{
  position:absolute; z-index:8; top:2px; display:none; place-items:center;
  width:22px; height:22px; padding:0; border-radius:6px; cursor:pointer;
  border:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-secondary);
  font-size:8px; line-height:1; opacity:0;
}
.seat[data-state="working"] .stop,
.seat[data-state="waiting"] .stop{ display:grid; }
.seat[data-side="left"] .stop{ right:2px; }
.seat[data-side="right"] .stop{ left:2px; }
.seat:hover .stop,.seat:focus-within .stop{ opacity:1; }
.stop:hover{ border-color:var(--dsw-alias-state-error-primary); color:var(--dsw-alias-state-error-primary); }
.stop:focus-visible{ opacity:1; outline:2px solid var(--dsw-alias-state-error-primary); outline-offset:1px; }

/* ── 交接：阿策起身 → 沿过道走 → 递交 → 走回（1600ms） ────────────── */
.walker{
  display:none; position:absolute; z-index:9; left:var(--walk-x1,0); top:var(--walk-y1,0);
  width:46px; height:46px; transform:translate(-50%,-50%); pointer-events:none;
}
.floor.is-handoff .walker{ display:block; animation:of-walk 1600ms ease-in-out 1 both; }
.walker-shadow{
  position:absolute; left:50%; bottom:-5px; width:34px; height:7px; margin-left:-17px;
  border-radius:50%; background:var(--office-ink-shade);
}
.walker-step,.walker-step2,.walker-lift{ position:absolute; inset:0; }
.floor.is-handoff .walker-step{ animation:of-step 350ms ease-in-out 200ms 2; }
.floor.is-handoff .walker-step2{ animation:of-step 225ms ease-in-out 1150ms 2; }
.floor.is-handoff .walker-lift{ animation:of-lift 1600ms ease-in-out 1 both; }
.walker .mascot{ top:0; }
.floor.is-handoff .walker .ms-paper{ animation:of-paper 1600ms linear 1 both; }
/* 起身 / 落座：座位上的人淡出，回来时淡入 */
.seat.is-from .mascot{ animation:of-away 1600ms linear 1 both; }
.seat.is-from .desk,.seat.is-to .desk{ cursor:pointer; }
.seat.is-to .glow{ animation:of-lit 1600ms ease-out 1 both; }
.seat.is-to .file{ animation:of-land 1600ms ease-out 1 both; }

/* 0–200 起身｜200–900 走｜900–1150 递交｜1150–1600 走回 */
@keyframes of-walk{
  0%,12.5%      { left:var(--walk-x1); top:var(--walk-y1); }
  23.4375%      { left:var(--walk-xa); top:var(--walk-y1); }
  45.3125%      { left:var(--walk-xa); top:var(--walk-y2); }
  56.25%        { left:var(--walk-x2); top:var(--walk-y2); }
  71.875%       { left:var(--walk-x2); top:var(--walk-y2); }
  77.0625%      { left:var(--walk-xa); top:var(--walk-y2); }
  91.625%       { left:var(--walk-xa); top:var(--walk-y1); }
  100%          { left:var(--walk-x1); top:var(--walk-y1); }
}
@keyframes of-lift{
  0%      { transform:translateY(4px) scale(.9); }
  12.5%   { transform:translateY(-3px) scale(1); }
  56.25%  { transform:translateY(-3px) scale(1); }
  62%     { transform:translateY(1px) scale(.98); }
  71.875% { transform:translateY(-3px) scale(1); }
  100%    { transform:translateY(4px) scale(.9); }
}
@keyframes of-step{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-1.6px); } }
@keyframes of-paper{
  0%,56.25%{ opacity:1; }
  64%,100% { opacity:0; }
}
@keyframes of-land{
  0%,56.25%{ opacity:0; transform:translate(-50%,-8px) rotate(-8deg) scale(.8); }
  62%      { opacity:1; transform:translate(-50%,0) rotate(-8deg) scale(1); }
  100%     { opacity:1; transform:translate(-50%,0) rotate(-8deg) scale(1); }
}
@keyframes of-lit{
  0%,52%   { opacity:.35; }
  60%,74%  { opacity:1; }
  100%     { opacity:.35; }
}
@keyframes of-away{
  0%,8%    { opacity:1; }
  14%,94%  { opacity:.1; }
  100%     { opacity:1; }
}

/* 与正式代码同名的四条，语义保持一致。
   注意：这里用独立的 translate/rotate 属性而不是 transform —— 后脑勺靠
   transform:translateX(-50%) 居中，用 transform 做动画会把它覆盖掉。 */
@keyframes wt-bob{ 0%,100%{ translate:0 0; } 50%{ translate:0 -2px; } }
@keyframes wt-wait{ 0%,100%{ rotate:-1.5deg; } 50%{ rotate:1.5deg; } }
@keyframes wt-shake{ 0%,100%{ translate:0 0; } 25%{ translate:-1px 0; } 75%{ translate:1px 0; } }
@keyframes wt-bubble{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2px); } }
@keyframes wt-spin{ to{ transform:rotate(360deg); } }
@keyframes wt-sparkle{
  0%{ opacity:0; transform:scale(.4) rotate(0); }
  35%{ opacity:1; transform:scale(1.15) rotate(18deg); }
  100%{ opacity:0; transform:scale(.7) rotate(45deg) translateY(-6px); }
}

/* ── 底部控制区 ─────────────────────────────────────────────────── */
.foot{
  flex:none; display:flex; flex-direction:column; gap:7px;
  padding-top:8px; border-top:1px solid var(--dsw-alias-border-l1);
}
.relay-btn{
  width:100%; height:30px; border-radius:8px; cursor:pointer;
  border:1px solid var(--dsw-alias-border-l2);
  background:var(--dsw-alias-brand-primary); color:var(--dsw-alias-label-primary-inverted);
  font-size:11.5px; font-weight:600;
}
.relay-btn:hover{ filter:brightness(1.08); }
.relay-bar{ /* 始终占位：交接开始时不能把工位顶动 */
  display:flex; visibility:hidden; align-items:center; gap:6px; height:20px; padding:0 2px;
  font-size:10.5px; color:var(--dsw-alias-state-business-primary);
}
.relay-bar.is-on{ visibility:visible; }
.foot-label{ font-size:10px; line-height:13px; color:var(--dsw-alias-label-caption); }
.chips{ display:flex; flex-wrap:wrap; gap:4px; }
.chip{
  flex:none; height:24px; padding:0 7px; border-radius:6px; cursor:pointer;
  border:1px solid var(--dsw-alias-border-l1);
  background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-secondary);
  font-size:11px; line-height:1;
}
.chip:hover{ color:var(--dsw-alias-label-primary); border-color:var(--dsw-alias-border-l2); }
.chip[aria-checked="true"]{
  color:var(--dsw-alias-label-primary); font-weight:600;
  border-color:var(--dsw-alias-border-l2);
  box-shadow:inset 0 -2px 0 var(--role-accent,var(--dsw-alias-brand-primary));
}
.chip:focus-visible{ outline:2px solid var(--dsw-alias-brand-primary); outline-offset:1px; }

/* ── 说明卡 ─────────────────────────────────────────────────────── */
.notes{
  flex:1 1 240px; min-width:0; max-width:340px; padding:16px 18px;
  border:1px solid var(--dsw-alias-border-l1); border-radius:12px;
  background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-secondary);
  font-size:12px; line-height:1.7;
}
.notes h1{ margin:0 0 2px; font-size:14px; line-height:1.4; color:var(--dsw-alias-label-primary); }
.notes h1 small{ display:block; font-size:11px; font-weight:400; color:var(--dsw-alias-label-tertiary); }
.notes ul{ margin:10px 0 0; padding-left:16px; }
.notes li{ margin:3px 0; }
.notes b{ color:var(--dsw-alias-label-primary); font-weight:600; }
.notes a{ color:var(--dsw-alias-state-business-primary); text-decoration:none; }
.notes a:hover{ text-decoration:underline; }
.notes .kbd{
  display:inline-block; padding:0 4px; border-radius:4px; font-size:11px;
  border:1px solid var(--dsw-alias-border-l2); background:var(--dsw-alias-bg-layer-2);
  color:var(--dsw-alias-label-primary);
}

/* ── 窄栏 / 宽栏退化（容器查询，不是 @media） ──────────────────────── */
@container (max-width: 300px){
  .floor{ grid-template-columns:1fr 38px 1fr; }
  .floor::before{ width:38px; }
  .desk{ width:98px; }
  .monitor{ width:38px; height:16px; }
  .mascot{ width:42px; height:42px; }
  .plate{ font-size:10.5px; }
  .stat:nth-child(n+4){ display:none; }
  .chip{ height:22px; padding:0 6px; font-size:10.5px; }
}
@container (min-width: 340px){
  .plate-role,.plate-sep{ display:inline; }
  .floor{ grid-template-columns:1fr 56px 1fr; }
  .floor::before{ width:56px; }
  .desk{ width:150px; }
  .plate{ gap:3px; font-size:10.5px; }
}

/* ── reduced-motion：动效全停，布局不动 ───────────────────────────── */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation:none !important;
    transition:none !important;
  }
  .walker{ display:none !important; }
  .floor.is-handoff .file{ opacity:1; }
  .floor.is-handoff .ms-paper{ opacity:1; }
}


/* ══ 对照页：三列并排，每列 = 尺寸档 + 一个真的 B 工位区 ══════════════ */
:root{ --w:300px; }
.lab{ padding:14px 0 48px; }
.lab-bar{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:0 0 12px; margin:0 0 14px;
  border-bottom:1px solid var(--dsw-alias-border-l1);
}
.lab-title{ flex:1 1 100%; min-width:0; display:flex; flex-direction:column; gap:2px; }
.lab-title b{ font-size:15px; font-weight:650; }
.lab-title span{ font-size:11px; color:var(--dsw-alias-label-secondary); }
.cols{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; }
.col{ flex:0 0 auto; width:var(--w); display:flex; flex-direction:column; gap:10px; }
.col-head{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.col-head b{ font-size:12.5px; font-weight:650; }
.col-head span{ font-size:10.5px; line-height:1.5; color:var(--dsw-alias-label-secondary); }
.col-note{ margin:0; font-size:10px; line-height:1.5; color:var(--dsw-alias-label-caption); }
.col .frame{ width:100%; }

.tiers{ display:flex; flex-direction:column; gap:8px; }
.tier{
  border:1px solid var(--dsw-alias-border-l1); border-radius:10px; padding:8px 6px 6px;
  background:var(--dsw-alias-bg-layer-1);
}
.tier-l{ display:block; font-size:9.5px; line-height:1.4; color:var(--dsw-alias-label-caption); margin-bottom:6px; }
.tier-row{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:6px 0; }
.t40 .tier-row{ gap:8px 6px; }
.t96 .tier-row{ gap:10px; }
.spr{
  display:flex; flex-direction:column; align-items:center; gap:2px; width:var(--s);
  --wt-accent:var(--role-accent); --wt-raw:var(--role-accent);
}
.spr-box{ display:block; width:var(--s); height:var(--s); }
.spr-box .msvg{ width:100%; height:100%; }
.spr b{ font-size:8.5px; font-weight:400; line-height:1.2; color:var(--dsw-alias-label-tertiary); white-space:nowrap; }
.t96 .spr{ width:96px; }
.t96 b{ font-size:10px; }

/* 空位：第 7 行空着的右半格 */
.empty{
  grid-column:3; grid-row:var(--row); z-index:1; margin:5px 0 5px 7px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:1px dashed var(--dsw-alias-border-l2); border-radius:8px;
  color:var(--dsw-alias-label-caption); font-size:10px; line-height:14px;
}
.empty b{ font-weight:500; color:var(--dsw-alias-label-tertiary); }

/* 三套语言：先用同一份几何 + 不同的墨色/光影先占位，spec 到了换 sprite */
.lang-s2 .mascot, .lang-s2 .spr-box{ --wt-ink:#39424f; --wt-ink-2:#5b6675; }
.lang-s2 .msvg{
  filter:drop-shadow(0 1px 1px var(--office-ink-shade))
         drop-shadow(0 -1px 2px color-mix(in srgb,var(--wt-raw) 58%,transparent));
}
.lang-s3 .mascot, .lang-s3 .spr-box{ --wt-ink:#4c5769; --wt-ink-2:#7b8798; }
.lang-s3 .msvg{
  filter:drop-shadow(0 0 .7px var(--wt-ink)) drop-shadow(0 0 .7px var(--wt-ink))
         drop-shadow(0 -1px 1px color-mix(in srgb,var(--wt-raw) 40%,transparent));

}

<div class="lab">
  <header class="lab-bar">
    <div class="lab-title">
      <b>办公室美术对照</b>
      <span>三套语言 · 同 7 工位 · 同走廊 · 同一份交接时间轴</span>
    </div>
    <button class="bar-btn" id="themeBtn" type="button" aria-label="切换浅色或深色主题" aria-pressed="false">深色</button>
    <div class="bar-seg" role="group" aria-label="侧栏宽度">
      <button class="bar-btn" type="button" data-w="300" aria-label="侧栏宽度 300 像素" aria-pressed="true">300</button>
      <button class="bar-btn" type="button" data-w="380" aria-label="侧栏宽度 380 像素" aria-pressed="false">380</button>
    </div>
    <button class="bar-btn" id="allBtn" type="button" aria-label="三套美术同时播放一次走动">三套同时播放</button>
  </header>

  <div class="cols" id="cols"></div>
</div>

<script>
(function () {
  'use strict';

  var STATES = [
    { id: 'idle', label: '待命' }, { id: 'working', label: '干活中' },
    { id: 'waiting', label: '等你回复' }, { id: 'done', label: '有新结果' },
    { id: 'error', label: '异常结束' }, { id: 'failed', label: '入职失败' },
    { id: 'provisioning', label: '入职中' }
  ];
  var LABEL = {};
  STATES.forEach(function (s) { LABEL[s.id] = s.label; });

  var SPECIES = {
    pm:         { head: 'p-headcat', tail: 'p-tailcat', tag: 'p-tag-round', clip: 'cat' },
    frontend:   { head: 'p-headcat', tail: 'p-tailcat', tag: 'p-tag-square', clip: 'cat' },
    backend:    { head: 'p-headdog', tail: 'p-taildog', tag: 'p-tag-shield', clip: 'dog' },
    reviewer:   { head: 'p-headdog', tail: 'p-taildog', tag: 'p-tag-triangle', clip: 'dog' },
    researcher: { head: 'p-headfox', tail: 'p-tailfox', tag: 'p-tag-diamond', clip: 'fox' },
    designer:   { head: 'p-headcat', tail: 'p-tailcat', tag: 'p-tag-ring', clip: 'cat' },
    ops:        { head: 'p-headdog', tail: 'p-taildog', tag: 'p-tag-hex', clip: 'dog' },
    writer:     { head: 'p-headfox', tail: 'p-tailfox', tag: 'p-tag-bookmark', clip: 'fox' }
  };

  var POSE = {
    idle:         { tail: '', body: '', head: '', neck: '' },
    working:      { tail: 'rotate(6 50 58)', body: 'translate(0 -1.8)', head: 'translate(0 1.6)',
                    neck: 'translate(0 -.4)', hands: true },
    waiting:      { tail: 'rotate(-16 50 58)', body: 'rotate(-3 32 52)', head: 'translate(-1.6 0.4)' },
    handoff:      { tail: 'rotate(16 50 58)', body: 'rotate(-6 32 60)', head: 'rotate(-9 32 38)',
                    arm: true, paper: true },
    done:         { tail: 'rotate(20 50 58)', body: 'translate(0 -3.5)', head: 'translate(0 -3.5) rotate(-3 32 34)',
                    neck: 'translate(0 -3.5)', tag: 'translate(0 -3.5)', rim: 'translate(0 -3.5)' },
    error:        { tail: 'rotate(-16 50 58)', body: 'translate(0 1.5)', head: 'translate(0 2)',
                    neck: 'translate(0 1.5)', tag: 'translate(0 1.5)', rim: 'translate(0 1.5)' }
  };


  // 同 species 的两个人在 32px 下必须能分开：体型（肩宽）× 头身比，两个通道
  var BUILD = {
    pm:         { bx: 1.00, hs: 1.00 },
    frontend:   { bx: 0.86, hs: 1.10 },
    backend:    { bx: 1.08, hs: 0.97 },
    reviewer:   { bx: 0.93, hs: 1.04 },
    researcher: { bx: 0.98, hs: 1.00 },
    designer:   { bx: 0.90, hs: 1.07 },
    ops:        { bx: 1.16, hs: 0.92 },
    writer:     { bx: 0.96, hs: 1.02 }
  };

  var use = function (id, t) {
    return '<use href="#' + id + '"' + (t ? ' transform="' + t + '"' : '') + '/>';
  };

  function mascotSVG(memberId, state) {
    var sp = SPECIES[memberId] || SPECIES.pm;
    var p = POSE[state] || POSE.idle;
    var bd = BUILD[memberId] || BUILD.pm;
    var wrapBody = function (inner) {
      return bd.bx === 1 ? inner :
        '<g transform="translate(32 0) scale(' + bd.bx + ' 1) translate(-32 0)">' + inner + '</g>';
    };
    var wrapHead = function (inner) {
      return bd.hs === 1 ? inner :
        '<g transform="translate(32 46) scale(' + bd.hs + ') translate(-32 -46)">' + inner + '</g>';
    };
    var out = '<svg class="msvg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">';
    if (state === 'failed') {
      return out +
        '<g opacity=".38">' + use('p-body') + '</g>' +
        '<g fill="none" stroke="var(--wt-ink)" stroke-width="1.3" opacity=".62">' +
          '<circle cx="32" cy="31" r="15"/>' +
          '<path d="M19.5 21.5 23.2 7.5 29.5 18.8ZM44.5 21.5 40.8 7.5 34.5 18.8Z"/></g>' +
        '</svg>';
    }
    if (state === 'provisioning') {
      return out +
        '<g opacity=".3">' + use(sp.head) + use('p-body') + '</g>' +
        use('p-ghost') +
        '<g opacity=".55">' + use('p-collar') + use(sp.tag) + '</g>' +
        '</svg>';
    }
    out += use(sp.tail, p.tail);
    out += wrapBody(p.body ? '<g transform="' + p.body + '">' + use('p-body') + '</g>' : use('p-body'));
    if (p.arm) out += '<path class="ms-arm" d="M49 56.5 57 45" fill="none" stroke="var(--wt-ink)" stroke-width="5.2" stroke-linecap="round"/>';
    out += wrapHead(p.head ? '<g transform="' + p.head + '">' + use(sp.head) + '</g>' : use(sp.head));
    if (p.arm) out += '<circle cx="58" cy="43.4" r="3.1" fill="var(--wt-ink)"/>';
    if (p.paper) out += '<g class="ms-paper" transform="rotate(-16 59 35)">' +
      '<rect x="52" y="29.5" width="14.5" height="11" rx="1.4" fill="var(--wt-paper)"/>' +
      '<path d="M54.6 33.2h9M54.6 36.2h6.4" stroke="var(--wt-ink-2)" stroke-width=".9" opacity=".5" stroke-linecap="round"/></g>' +
      '<g class="ms-motion" fill="none" stroke="var(--wt-accent)" stroke-width="1.6" stroke-linecap="round" opacity=".6">' +
      '<path d="M44.5 26.5q3.6-3.2 7.8-3.6"/><path d="M43.6 33.4q3.8-1.4 6.8-.6"/></g>';
    if (p.hands) out += use('p-hands-type');
    out += wrapBody(p.neck ? use('p-collar', p.neck) : use('p-collar'));
    out += wrapBody(p.tag ? use(sp.tag, p.tag) : use(sp.tag));
    out += p.rim ? use('p-rim', p.rim) : use('p-rim');
    out += '<rect x="0" y="0" width="64" height="64" fill="url(#lit)" clip-path="url(#clip-' +
      sp.clip + ')" style="mix-blend-mode:screen"/>';
    return out + '</svg>';
  }

  var MEMBERS = [
    { id: 'pm', name: '阿策', role: '产品经理', accent: '#f59e0b', soft: '#fff2cc' },
    { id: 'frontend', name: '小前', role: '前端工程师', accent: '#2d7ff9', soft: '#dcebff' },
    { id: 'reviewer', name: '小审', role: '审查 / 测试', accent: '#e04b4b', soft: '#ffe1e1' },
    { id: 'backend', name: '老后', role: '后端工程师', accent: '#21a67a', soft: '#d9f7ea' },
    { id: 'researcher', name: '小研', role: '研究员', accent: '#7c5cff', soft: '#e9e2ff' },
    { id: 'designer', name: '小设', role: '设计师', accent: '#d94f9c', soft: '#ffe3f2' },
    { id: 'ops', name: '老运', role: '运维 / 脚本', accent: '#e07a2f', soft: '#ffead9' },
    { id: 'writer', name: '笔笔', role: '文案 / 写作', accent: '#b4534b', soft: '#ffe6e1' }
  ];
  // 办公室只坐 7 个（lead 不进办公室，笔笔还没招），第 8 个位置留空位卡
  var SEATS = MEMBERS.slice(0, 7);
  var INIT = { pm: 'working', frontend: 'working', reviewer: 'waiting', backend: 'idle',
               researcher: 'working', designer: 'done', ops: 'idle' };

  var LANGS = [
    { id: 's1', name: 'S1 · 平面剪影 + 屏幕光', note: '小设推荐：剪影最干净，屏幕光是唯一颜色来源' },
    { id: 's2', name: 'S2 · 软陶质感', note: '剪影抬高两档、加内高光和投影，像捏出来的' },
    { id: 's3', name: 'S3 · 线描淡彩', note: '更浅的墨色 + 细描边，项圈是唯一的实色' }
  ];

  var vars = function (m) { return '--role-accent:' + m.accent + ';--role-soft:' + m.soft; };
  function sheetCell(pre, role, state) {
    return '<svg class="msvg" viewBox="0 0 40 40" aria-hidden="true" focusable="false">' +
      '<use href="#' + pre + '-c-' + role + '-' + state + '"/></svg>';
  }
  function sheetTier(pre, role, kind) {
    var vb = kind === 'r' ? 32 : 48;
    return '<svg class="msvg" viewBox="0 0 ' + vb + ' ' + vb + '" aria-hidden="true" focusable="false">' +
      '<use href="#' + pre + '-' + kind + '-' + role + '"/></svg>';
  }
  function memberOf(id) {
    for (var i = 0; i < MEMBERS.length; i++) if (MEMBERS[i].id === id) return MEMBERS[i];
    return MEMBERS[0];
  }

  // ── 尺寸档：8 角色 × 32 / 40，96 用三个物种代表 ──────────────────────
  function spriteCell(pre, m, size) {
    var kind = size <= 32 ? 'r' : 'd';
    return '<span class="spr" style="--s:' + size + 'px;' + vars(m) + '">' +
      '<span class="spr-box">' + sheetTier(pre, m.id, kind) + '</span>' +
      '<b>' + m.name + '</b></span>';
  }
  function tiersHTML(pre) {
    var r32 = MEMBERS.map(function (m) { return spriteCell(pre, m, 32); }).join('');
    var r40 = MEMBERS.map(function (m) { return spriteCell(pre, m, 40); }).join('');
    var r96 = ['pm', 'backend', 'researcher', 'writer'].map(function (id) {
      var m = memberOf(id);
      return '<span class="spr" style="--s:96px;' + vars(m) + '">' +
        '<span class="spr-box">' + sheetTier(pre, id, 'd') + '</span><b>' + m.name + '</b></span>';
    }).join('');
    return '<div class="tiers">' +
      '<div class="tier"><span class="tier-l">32px · 一排八个人</span><div class="tier-row t32">' + r32 + '</div></div>' +
      '<div class="tier"><span class="tier-l">40px · 真实行内尺寸</span><div class="tier-row t40">' + r40 + '</div></div>' +
      '<div class="tier"><span class="tier-l">96px · 放大看几何（猫 / 狗 / 狐）</span><div class="tier-row t96">' + r96 + '</div></div>' +
    '</div>';
  }

  // ── 把 B 的工位区搬进一列 ────────────────────────────────────────────
  function officeHTML() {
    return '<div class="frame">' +
      '<div class="frame-tabs" role="tablist" aria-label="办公室">' +
        '<button class="frame-tab" type="button" role="tab" aria-selected="true" aria-label="办公室标签页">办公室</button>' +
        '<button class="frame-tab" type="button" role="tab" aria-selected="false" aria-label="任务板标签页">任务板</button>' +
        '<span class="frame-spacer"></span></div>' +
      '<div class="office"><p class="stats"></p><div class="floor"></div>' +
        '<p class="relay-bar" role="status"></p>' +
        '<div class="foot">' +
          '<button class="relay-btn" type="button" aria-label="触发一次交接演示：阿策把文件交给老后">触发交接</button>' +
          '<span class="foot-label" id="pk' + '">选人</span>' +
          '<div class="chips pick"></div>' +
          '<span class="foot-label">切状态</span>' +
          '<div class="chips"></div>' +
        '</div></div></div>';
  }

  function artHTML(m, state, pre) {
    return '<span class="art">' +
      '<span class="chair"></span><span class="ground"></span>' +
      '<span class="monitor"><svg class="mon-svg" viewBox="0 0 78 32" aria-hidden="true" focusable="false"><use href="#mon-unit"/><use class="scr" href="#scr-idle"/></svg><span class="mshadow"></span><span class="glow"></span><span class="leak"></span></span>' +
      '<span class="mascot">' + sheetCell(pre, m.id, state) +
        '<span class="ring"></span><span class="bubble">?</span><span class="sparkle">✦</span><span class="file"></span>' +
      '</span>' +
      '<span class="surface"></span></span>';
  }

  function seatHTML(m, i, pre) {
    var side = i % 2 === 0 ? 'left' : 'right';
    return '<div class="seat" data-member="' + m.id + '" data-side="' + side + '" data-state="' + INIT[m.id] + '"' +
      ' data-picked="' + (m.id === 'pm') + '" style="--row:' + (i + 1) + ';' + vars(m) + '">' +
      '<button class="desk" type="button" data-desk="' + m.id + '"' +
        ' aria-label="' + m.name + ' · ' + m.role + ' · ' + LABEL[INIT[m.id]] + ' · 打开会话"' +
        ' title="' + m.name + ' · ' + m.role + ' · ' + LABEL[INIT[m.id]] + '">' +
        artHTML(m, INIT[m.id], pre) +
        '<span class="plate"><span class="plate-name">' + m.name + '</span>' +
          '<span class="plate-sep">·</span><span class="plate-role">' + m.role + '</span>' +
          '<span class="plate-dot"></span><span class="plate-state">' + LABEL[INIT[m.id]] + '</span></span>' +
      '</button>' +
      '<button class="stop" type="button" data-stop="' + m.id + '" aria-label="暂停 ' + m.name + '">■</button>' +
    '</div>';
  }

  function mount(col, colIndex) {
    var pre = LANGS[colIndex].id;
    var root = col.querySelector('.host');
    root.innerHTML = officeHTML();
    var floor = root.querySelector('.floor');
    var stats = root.querySelector('.stats');
    var relayBar = root.querySelector('.relay-bar');
    var relayBtn = root.querySelector('.relay-btn');
    var stateBox = root.querySelector('.chips:not(.pick)');
    var pickBox = root.querySelector('.chips.pick');
    var picked = 'pm';
    var relayTimer = 0;
    // 只有第一列带 data-state-to：验收脚本按这个属性收集「态」，三列都带会被当成 21 个态
    var stAttr = colIndex === 0 ? 'data-state-to' : 'data-st';

    var seatOf = function (id) { return floor.querySelector('.seat[data-member="' + id + '"]'); };

    function refreshStats() {
      var n = {};
      Array.prototype.forEach.call(floor.querySelectorAll('.seat'), function (seat) {
        var st = seat.getAttribute('data-state');
        n[st] = (n[st] || 0) + 1;
      });
      var parts = ['<span class="stat">' + SEATS.length + ' 人</span>'];
      if (n.working) parts.push('<span class="stat">' + n.working + ' 干活中</span>');
      if (n.waiting) parts.push('<span class="stat">' + n.waiting + ' 等你回复</span>');
      if (n.done) parts.push('<span class="stat">' + n.done + ' 有新结果</span>');
      if ((n.error || 0) + (n.failed || 0)) parts.push('<span class="stat">' + ((n.error || 0) + (n.failed || 0)) + ' 异常</span>');
      stats.innerHTML = parts.join('');
    }

    function setState(id, state) {
      var m = memberOf(id);
      var seat = seatOf(id);
      if (!seat) return;
      seat.setAttribute('data-state', state);
      var desk = seat.querySelector('.desk');
      desk.setAttribute('aria-label', m.name + ' · ' + m.role + ' · ' + LABEL[state] + ' · 打开会话');
      desk.setAttribute('title', m.name + ' · ' + m.role + ' · ' + LABEL[state]);
      seat.querySelector('.plate-state').textContent = LABEL[state];
      var mu = seat.querySelector('.mascot use');
      if (mu) mu.setAttribute('href', '#' + pre + '-c-' + m.id + '-' + state);
      var scr = seat.querySelector('.scr');
      if (scr) scr.setAttribute('href', '#scr-' + state);
      refreshStats();
    }

    function paintChips() {
      pickBox.innerHTML = MEMBERS.map(function (m) {
        var on = m.id === picked;
        return '<button class="chip" type="button" role="radio" data-pick="' + m.id + '"' +
          ' aria-checked="' + on + '" tabindex="' + (on ? 0 : -1) + '"' +
          ' aria-label="选择 ' + m.name + '" style="--role-accent:' + m.accent + '">' + m.name + '</button>';
      }).join('');
      stateBox.innerHTML = STATES.map(function (s) {
        var on = seatOf(picked).getAttribute('data-state') === s.id;
        return '<button class="chip" type="button" role="radio" ' + stAttr + '="' + s.id + '"' +
          ' aria-checked="' + on + '" tabindex="' + (on ? 0 : -1) + '"' +
          ' aria-label="把' + memberOf(picked).name + '切到 ' + s.label + '">' + s.label + '</button>';
      }).join('');
    }

    function playRelay(fromId, toId) {
      var from = memberOf(fromId);
      var a = seatOf(from.id);
      var b = seatOf(toId);
      if (!a || !b || from.id === toId) return;
      if (floor.classList.contains('is-handoff')) return;

      var fr = floor.getBoundingClientRect();
      var ma = a.querySelector('.mascot').getBoundingClientRect();
      var mb = b.querySelector('.mascot').getBoundingClientRect();
      var x1 = ma.left - fr.left + ma.width / 2;
      var y1 = ma.top - fr.top + ma.height / 2;
      var x2 = mb.left - fr.left + mb.width / 2;
      var y2 = mb.top - fr.top + mb.height / 2;
      x2 += (x2 > fr.width / 2 ? -1 : 1) * (mb.width / 2 + 8);

      floor.style.setProperty('--walk-x1', x1.toFixed(1) + 'px');
      floor.style.setProperty('--walk-y1', y1.toFixed(1) + 'px');
      floor.style.setProperty('--walk-x2', x2.toFixed(1) + 'px');
      floor.style.setProperty('--walk-y2', y2.toFixed(1) + 'px');
      floor.style.setProperty('--walk-xa', (fr.width / 2).toFixed(1) + 'px');

      var walker = floor.querySelector('.walker');
      walker.style.setProperty('--role-accent', from.accent);
      walker.style.setProperty('--role-soft', from.soft);
      var wu = walker.querySelector('.mascot use');
      if (wu) wu.setAttribute('href', '#' + pre + '-c-' + from.id + '-working');

      clearTimeout(relayTimer);
      floor.classList.add('is-handoff');
      a.classList.add('is-from');
      b.classList.add('is-to');
      relayBar.textContent = from.name + ' → ' + memberOf(toId).name + ' · 交接中';
      relayBar.classList.add('is-on');
      relayTimer = setTimeout(function () {
        floor.classList.remove('is-handoff');
        a.classList.remove('is-from');
        b.classList.remove('is-to');
        relayBar.classList.remove('is-on');
      }, 1600);
    }

    var html = '';
    SEATS.forEach(function (m, i) { html += seatHTML(m, i, pre); });
    html += '<div class="empty" aria-hidden="true" style="--row:7"><b>空位</b><span>编制 8 · 可招</span></div>';
    html += '<div class="walker" aria-hidden="true"><span class="walker-shadow"></span>' +
      '<span class="walker-step"><span class="walker-step2"><span class="walker-lift">' +
      '<span class="mascot"></span></span></span></span></div>';
    floor.innerHTML = html;
    floor.querySelector('.walker .mascot').innerHTML = sheetCell(pre, 'pm', 'working');
    paintChips();
    refreshStats();

    relayBtn.addEventListener('click', function () { playRelay('pm', 'backend'); });
    floor.addEventListener('click', function (event) {
      var stop = event.target.closest('.stop');
      if (stop) { setState(stop.getAttribute('data-stop'), 'idle'); paintChips(); return; }
      var desk = event.target.closest('.desk');
      if (desk) {
        picked = desk.getAttribute('data-desk');
        Array.prototype.forEach.call(floor.querySelectorAll('.seat'), function (s) {
          s.setAttribute('data-picked', String(s.getAttribute('data-member') === picked));
        });
        paintChips();
      }
    });
    pickBox.addEventListener('click', function (event) {
      var chip = event.target.closest('[data-pick]');
      if (!chip) return;
      picked = chip.getAttribute('data-pick');
      Array.prototype.forEach.call(floor.querySelectorAll('.seat'), function (st) {
        st.setAttribute('data-picked', String(st.getAttribute('data-member') === picked));
      });
      paintChips();
    });
    pickBox.addEventListener('keydown', function (event) {
      var keys = ['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp', 'Home', 'End'];
      if (keys.indexOf(event.key) < 0) return;
      event.preventDefault();
      var items = Array.prototype.slice.call(pickBox.querySelectorAll('[data-pick]'));
      var at = items.indexOf(document.activeElement);
      if (at < 0) at = 0;
      var next = event.key === 'Home' ? 0 : event.key === 'End' ? items.length - 1
        : (at + ((event.key === 'ArrowLeft' || event.key === 'ArrowUp') ? -1 : 1) + items.length) % items.length;
      picked = items[next].getAttribute('data-pick');
      Array.prototype.forEach.call(floor.querySelectorAll('.seat'), function (st) {
        st.setAttribute('data-picked', String(st.getAttribute('data-member') === picked));
      });
      paintChips();
      var fresh = pickBox.querySelectorAll('[data-pick]')[next];
      if (fresh) fresh.focus();
    });
    stateBox.addEventListener('click', function (event) {
      var chip = event.target.closest('[data-state-to],[data-st]');
      if (!chip) return;
      setState(picked, chip.getAttribute('data-state-to') || chip.getAttribute('data-st'));
      paintChips();
    });
    // roving tabindex：Tab 只落一个 chip，组内用方向键移动
    stateBox.addEventListener('keydown', function (event) {
      var keys = ['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp', 'Home', 'End'];
      if (keys.indexOf(event.key) < 0) return;
      event.preventDefault();
      var items = Array.prototype.slice.call(stateBox.querySelectorAll('[' + stAttr + ']'));
      var at = items.indexOf(document.activeElement);
      if (at < 0) at = 0;
      var next = event.key === 'Home' ? 0 : event.key === 'End' ? items.length - 1
        : (at + ((event.key === 'ArrowLeft' || event.key === 'ArrowUp') ? -1 : 1) + items.length) % items.length;
      setState(picked, items[next].getAttribute(stAttr));
      paintChips();
      var fresh = stateBox.querySelectorAll('[' + stAttr + ']')[next];
      if (fresh) fresh.focus();
    });

    return { play: function () { playRelay('pm', 'backend'); } };
  }

  // ── 组装三列 ────────────────────────────────────────────────────────
  var cols = document.getElementById('cols');
  cols.innerHTML = LANGS.map(function (lang) {
    return '<section class="col lang-' + lang.id + '" data-lang="' + lang.id + '">' +
      '<div class="col-head"><b>' + lang.name + '</b><span>' + lang.note + '</span></div>' +
      tiersHTML(lang.id) +
      '<div class="host"></div>' +

    '</section>';
  }).join('');

  var offices = Array.prototype.map.call(cols.querySelectorAll('.col'), function (col, i) {
    return mount(col, i);
  });

  document.getElementById('allBtn').addEventListener('click', function () {
    offices.forEach(function (o) { o.play(); });
  });

  document.getElementById('themeBtn').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    this.setAttribute('aria-pressed', String(dark));
    this.textContent = dark ? '浅色' : '深色';
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (btn) {
    btn.addEventListener('click', function () {
      var w = this.getAttribute('data-w');
      document.documentElement.style.setProperty('--w', w + 'px');
      Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function (other) {
        other.setAttribute('aria-pressed', String(other === btn));
      });
    });
  });
})();
</script>
</body>
</html>
